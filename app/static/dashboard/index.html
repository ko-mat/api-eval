<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">HR System</div>
            <nav class="nav">
                <a href="#" class="nav-item active" id="nav-employees">Employees</a>
                <a href="#" class="nav-item" id="nav-departments">Departments</a>
            </nav>
            <div class="sidebar-user" id="sidebar-user" style="display:none; margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--border);">
                <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.25rem;">Logged in as</div>
                <div style="font-weight: 600; margin-bottom: 0.75rem;" id="current-username">admin</div>
                <button class="btn btn-secondary btn-block" id="btn-logout" style="padding: 0.4rem; font-size: 0.85rem;">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Employees Section -->
            <div id="section-employees">
                <header class="header">
                    <h1>Employees</h1>
                    <button class="btn btn-primary" id="btn-add">New Employee</button>
                </header>
                
                <div class="filters">
                    <select id="department-filter" class="filter-select">
                        <option value="">All Departments</option>
                    </select>
                </div>

                <!-- Employee Grid -->
                <div class="grid" id="employee-grid">
                    <!-- Skeleton loader / Cards injected by JS -->
                </div>
            </div>

            <!-- Departments Section -->
            <div id="section-departments" style="display: none;">
                <header class="header">
                    <h1>Departments</h1>
                    <button class="btn btn-primary" id="btn-add-dept">New Department</button>
                </header>
                
                <div class="table-container">
                    <table class="dept-table">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Name</th>
                                <th>Created At</th>
                            </tr>
                        </thead>
                        <tbody id="dept-table-body">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Drawer (New Employee) -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <h2>Add Employee</h2>
            <button class="btn-close" id="btn-drawer-close">&times;</button>
        </div>
        <div class="drawer-body">
            <form id="form-employee" novalidate>
                <div class="form-group">
                    <label for="employee_code">Employee Code</label>
                    <input type="text" id="employee_code" name="employee_code" required placeholder="e.g. EMP_DEV_01">
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name" required placeholder="山田">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name" required placeholder="太郎">
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="example@example.com">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone" placeholder="e.g. 090-1234-5678">
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" placeholder="e.g. 東京都新宿区">
                </div>
                <div class="form-group">
                    <label for="birth_date">Birth Date</label>
                    <input type="date" id="birth_date" name="birth_date">
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label for="department_id">Department</label>
                        <select id="department_id" name="department_id" required></select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="role">Role</label>
                        <input type="text" id="role" name="role" required placeholder="一般" value="一般">
                    </div>
                </div>
                <div class="form-group">
                    <label for="photo">Photo</label>
                    <input type="file" id="photo" name="photo" accept="image/*">
                    <div id="photo-preview" class="photo-preview">Preview</div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Save</button>
            </form>
        </div>
    </div>

    <!-- Drawer (New Department) -->
    <div class="drawer-overlay" id="drawer-overlay-dept" style="display: none;"></div>
    <div class="drawer" id="drawer-dept">
        <div class="drawer-header">
            <h2>Add Department</h2>
            <button class="btn-close" id="btn-drawer-close-dept">&times;</button>
        </div>
        <div class="drawer-body">
            <form id="form-department" novalidate>
                <div class="form-group">
                    <label for="dept_code">Department Code</label>
                    <input type="text" id="dept_code" name="code" required placeholder="e.g. DEV">
                </div>
                <div class="form-group">
                    <label for="dept_name">Department Name</label>
                    <input type="text" id="dept_name" name="name" required placeholder="e.g. 開発部">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Save</button>
            </form>
        </div>
    </div>

    <!-- Modal (Employee Details) -->
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal" id="modal">
        <div class="modal-header">
            <h2 id="modal-name">Employee Name</h2>
            <button class="btn-close" id="btn-modal-close">&times;</button>
        </div>
        <div class="modal-body">
            <div class="detail-header">
                <img src="" id="modal-photo" class="detail-photo" alt="Photo" style="display:none;">
                <div class="detail-info">
                    <p class="detail-email" id="modal-email"></p>
                    <p class="detail-dept" id="modal-department"></p>
                    <p class="detail-phone" id="modal-phone"></p>
                    <p class="detail-address" id="modal-address"></p>
                    <p class="detail-birth" id="modal-birth-date"></p>
                </div>
            </div>
            
            <div class="timeline-section">
                <h3>Career History</h3>
                <div class="timeline" id="timeline">
                    <!-- Timeline items injected by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal (Login) -->
    <div class="modal-overlay" id="login-overlay" style="z-index: 999; backdrop-filter: blur(4px);"></div>
    <div class="modal" id="login-modal" style="z-index: 1000; max-width: 400px;">
        <div class="modal-header" style="border-bottom: none; padding-bottom: 0;">
            <h2>Admin Login</h2>
        </div>
        <div class="modal-body">
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem;">Please enter administrator credentials to access HR API System.</p>
            <form id="form-login" novalidate>
                <div class="form-group">
                    <label for="login_username">Username</label>
                    <input type="text" id="login_username" name="username" required placeholder="admin" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login_password">Password</label>
                    <input type="password" id="login_password" name="password" required placeholder="••••••••" autocomplete="current-password">
                </div>
                <div id="login-error" style="display: none; color: var(--danger); font-size: 0.85rem; margin-bottom: 1rem;"></div>
                <button type="submit" class="btn btn-primary btn-block" id="btn-login-submit">Login</button>
            </form>
        </div>
    </div>

    <script src="app.js?v=3"></script>
</body>
</html>
