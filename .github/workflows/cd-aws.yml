name: CD - Deploy to AWS EC2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Deployment Target"
        required: true
        default: "AWS-EC2-WebAP"
        type: choice
        options:
          - "AWS-EC2-WebAP"

jobs:
  ci-quality-gate:
    name: Run CI Tests before Deploy
    uses: ./.github/workflows/ci.yml

  deploy-aws:
    name: Deploy to AWS EC2 (Native WebAP)
    runs-on: ubuntu-latest
    needs: ci-quality-gate
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-northeast-1' }}

      - name: Package Application Code
        run: |
          zip -r hr_api_code.zip . -x ".git/*" ".github/*" "tests/*" "__pycache__/*" "*.pytest_cache/*"

      - name: Find Target S3 Bucket and Upload Code
        id: s3-upload
        run: |
          BUCKET_NAME=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 's3-api-eval-')].Name" --output text | awk '{print $NF}')
          if [ -z "$BUCKET_NAME" ]; then
            echo "Error: No matching s3-api-eval-* bucket found."
            exit 1
          fi
          echo "Target S3 Bucket: $BUCKET_NAME"
          aws s3 cp hr_api_code.zip "s3://$BUCKET_NAME/_deploy/hr_api_code.zip"
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT

      - name: Deploy Code to WebAP EC2 via AWS SSM
        run: |
          WEB_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ec2-api-eval-webap-*" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$WEB_INSTANCE_ID" ] || [ "$WEB_INSTANCE_ID" = "None" ]; then
            echo "Warning: No running WebAP instance found. Skipping live deployment."
            exit 0
          fi

          echo "Deploying to WebAP Instance: $WEB_INSTANCE_ID"
          BUCKET_NAME="${{ steps.s3-upload.outputs.bucket_name }}"

          DEPLOY_SCRIPT="aws s3 cp s3://${BUCKET_NAME}/_deploy/hr_api_code.zip /tmp/code.zip --region ap-northeast-1 && unzip -o /tmp/code.zip -d /opt/hr-api/ && chmod -R 755 /opt/hr-api && rm -f /tmp/code.zip && systemctl restart hr-api"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$WEB_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"$DEPLOY_SCRIPT\", \"sleep 3\", \"systemctl status hr-api --no-pager\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command sent. Command ID: $COMMAND_ID"
          sleep 8

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$WEB_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

      - name: Perform Health Check
        run: |
          WEB_PUBLIC_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ec2-api-eval-webap-*" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          if [ -n "$WEB_PUBLIC_IP" ] && [ "$WEB_PUBLIC_IP" != "None" ]; then
            echo "Verifying HTTPS endpoint at https://${WEB_PUBLIC_IP}/ ..."
            curl -k -f --retry 5 --retry-delay 3 "https://${WEB_PUBLIC_IP}/" || exit 1
            echo "Deployment to AWS EC2 verified successfully!"
          fi
