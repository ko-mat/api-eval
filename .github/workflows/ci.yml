name: CI Pipeline (Quality Gate)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: Run Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx aiosqlite flake8

      - name: Run Flake8 Lint
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run Automated Pytest Suite
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          STORAGE_BACKEND: "local"
          ENCRYPTION_KEY: "T5G7Uv5Y9pPq1XJdfk7D7h9kLmNpQrStUvWxYz01234="
          JWT_SECRET: "ci-secret-jwt-key-2026"
        run: |
          pytest tests -v --durations=10

  docker-build:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image (No Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: hr-api-eval:ci-test
